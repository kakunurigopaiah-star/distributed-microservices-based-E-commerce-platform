name: Java 25 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - auth-service
          - cart-serivce
          - eureka-server
          - notification-service
          - order-service
          - payment-service
          - product-service
          - user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Compile main and test sources
        working-directory: ${{ matrix.module }}
        run: bash ./mvnw --batch-mode --no-transfer-progress clean test-compile
