<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #2874f0;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2874f0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1255c5;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>My E-Commerce</h2>

    <div>
        <a href="http://127.0.0.1:8091/product.html">Products</a>
        <a href="http://127.0.0.1:8093/cart.html">Cart</a>
        <a href="http://127.0.0.1:8094/order.html">Orders</a>
        <a href="http://127.0.0.1:8090/login.html">Logout</a>
    </div>
</div>

<div class="container">

    <h2>User Profile</h2>

    <div class="form-group">
        <label>User ID</label>
        <input type="text" id="userId" placeholder="Enter User ID">
    </div>

    <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter Name">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Email">
    </div>

    <div class="form-group">
        <label>Mobile</label>
        <input type="text" id="mobile" placeholder="Enter Mobile Number">
    </div>

    <div class="form-group">
        <label>Address</label>
        <input type="text" id="address" placeholder="Enter Address">
    </div>

    <button onclick="saveUser()">Save User</button>

    <p id="message"></p>

</div>

<script>

const API_URL = "http://localhost:8080/users";

function saveUser() {

    const user = {
        id: document.getElementById("userId").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        address: document.getElementById("address").value
    };

    fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save user");
        }

        return response.json();
    })
    .then(data => {

        document.getElementById("message").innerText =
            "User saved successfully!";

        console.log(data);

    })
    .catch(error => {

        document.getElementById("message").innerText =
            "Error: " + error.message;

        console.error(error);

    });
}

</script>

</body>
</html>
