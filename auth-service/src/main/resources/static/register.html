<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>E-Commerce - Register</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .container {
            width: 380px;
            max-width: calc(100% - 32px);
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2874f0;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1257c7;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2874f0;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            aria-label="Name"
            autocomplete="name"
            placeholder="Enter your name"
            required
        >

        <input
            type="email"
            id="email"
            aria-label="Email address"
            autocomplete="email"
            placeholder="Enter your email"
            required
        >

        <input
            type="password"
            id="password"
            aria-label="Password"
            autocomplete="new-password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div
        class="message"
        id="message">
    </div>

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

const API_BASE_URL = "http://localhost:8080";

document
.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const user = {

        name: name,

        email: email,

        password: password

    };


    try {

        const response = await fetch(
            API_BASE_URL + "/auth/register",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(user)

            }
        );


        const result =
            await response.text();


        document
        .getElementById("message")
        .innerText = result;


        if (result === "Registration successful") {

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1000);

        }

    }

    catch (error) {

        console.error(error);

        document
        .getElementById("message")
        .innerText =
            "Unable to connect to server";

    }

});

</script>

</body>

</html>
